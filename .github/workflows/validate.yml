name: Electron Web Control PoC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Electron dependency
        run: npm install --no-audit --no-fund
      - name: Configure Electron SUID sandbox helper in disposable runner
        shell: bash
        run: |
          binary=$(node -p "require('electron')" | tail -n 1)
          echo "Electron binary: $binary"
          ls -la node_modules/electron || :
          ls -la "$(dirname "$binary")" || :
          helper="$(dirname "$binary")/chrome-sandbox"
          echo "Electron sandbox helper before:"
          ls -l "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          echo "Electron sandbox helper after:"
          stat -c 'mode=%a owner=%u file=%n' "$helper"
          test -u "$helper"
          test "$(stat -c %u "$helper")" = 0
      - name: Syntax-check runtime and tests
        run: npm run check
      - name: Exercise real Electron window and local service under Xvfb
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: '0'
        run: timeout --signal=TERM 180s xvfb-run -a npm test
